# cluster commands
cluster: 
  mkdir -p logs/cluster_logs/`date +"%Y%m%d"`/{rule} &&
  sbatch 
    --job-name={rule}
    --output=logs/cluster_logs/`date +"%Y%m%d"`/{rule}/%j.out
    --partition={resources.partition}
    --account=pschloss0
    --nodes=1
    --time=100:00:00
    --mem={resources.mem_mb}
    -c{resources.threads}
    
#    --mem=8000mb
# default resources used for rules with no Resources specified
default-resources: 
  - cpus=1
  - threads=1
  - mem_mb=4000
  - partition=standard
  - time_min=120
  - job_name="rare"
  
# snakemake args
jobs: 4995
scheduler: "greedy"
rerun-incomplete: true
# rerun-triggers: mtime
# dry-run: true
use-conda: true
conda-frontend: "conda"
keep-going: true
latency-wait: 120
touch: false
conda-cleanup-envs: false
conda-create-envs-only: false
group-components:
  - calc_dist_axes_gemelli=20
  - calc_dist_axes_optspace=10
  - calc_dist_from_pcoa=10
  - calc_dist_norare=10
  - calc_dist_rarefaction=5
  - calc_dist_subsample=10
  - calc_pcoa_from_dist=20
  - partition_by_nsamples=20
  - partition_by_size=10
  - test_permanova_treatment=20
  - test_permanova_size=20
  - transform_clr=10
  - transform_oclr=10
  - transform_css=10
  - transform_deseq2=10
  - transform_relabund=10
  - transform_srs=10
