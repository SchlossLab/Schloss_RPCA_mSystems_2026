# cluster commands
cluster: 
  mkdir -p logs/cluster_logs/`date +"%Y%m%d"`/{rule} &&
  sbatch 
    --job-name={rule}
    --output=logs/cluster_logs/`date +"%Y%m%d"`/{rule}/%j.out
    --partition={resources.partition}
    --account=pschloss1
    --nodes=1
    --time=100:00:00
    --mem={resources.mem_mb}
    -c1
    
#    --mem=8000mb
# default resources used for rules with no Resources specified
default-resources: 
  - cpus=1
  - mem_mb=4000
  - partition=standard
  - time_min=120
  - job_name="rare"
  
# snakemake args
jobs: 3000
scheduler: "greedy"
rerun-incomplete: true
use-conda: true
conda-frontend: "mamba"
keep-going: true
latency-wait: 120
touch: false
conda-cleanup-envs: false
conda-create-envs-only: false
group-components:
  - partition_by_nsamples=30
  - partition_by_size=10
  - transform_oclr=30
  - calc_dist_axes_gemelli=50
  - calc_dist=50
  - calc_pcoa_from_dist=50
  - test_permanova=35
  - test_knn=5
